name: CI/CD 03-Library App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-22.04

    steps:
    - name: Check out the repository
      uses: actions/checkout@v5
      
    - name: Use Node.js 20
      uses: actions/setup-node@v5
      with:
        node-version: 20

    - name: Install dependencies    
      run: npm install

    # 1. Стартираме Бекенда на заден план чрез "&"
    - name: Start Backend Server
      run: cd server && node server.js &

    # 2. Стартираме Фронтенда на заден план чрез "&"
    - name: Start Frontend App
      run: npm start &

    # 3. Умен "sleep" – чакаме порт 3000 да се събуди (максимум 30 секунди)
    - name: Wait for App to be ready
      run: npx wait-on http://localhost:3000 --timeout 30000

    # 4. Инсталираме браузърите за Playwright
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
      
    # 5. Пускаме тестовете
    - name: Run the tests
      run: npm test
